plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'

group = 'com.fabryolc05'

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.0'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand 'version':project.version, 'minecraft_version':project.minecraft.version
    }
    include '**/*.json', '**/*.png', '**/*.xml', '**/*.properties'
}

loom {
    refreshVersions = true
    refreshDeps = true
    ide {
        runConfigs {
            client {
                mainClass = 'net.fabricmc.devlaunchinjector.Main'
                programArgs 'client'
            }
            server {
                mainClass = 'net.fabricmc.devlaunchinjector.Main'
                programArgs 'server'
            }
        }
    }
}